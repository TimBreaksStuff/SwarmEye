<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; img-src 'self' data:" />
  <title>SwarmEye</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/app.css" />
  <!-- Per-area sheets, one per features/<area>/. These were cut out of app.css
       and load in app.css's own order, BEFORE chrome-clean.css — that sheet's
       whole job is overriding these rules, so loading them after it would flip
       every one of those overrides at once. -->
  <link rel="stylesheet" href="features/rail/rail.css" />
  <link rel="stylesheet" href="features/pane/pane.css" />
  <!-- lib/tooltip.js's own sheet. No area owns the hover tooltip, so it does
       not belong in one; it sits where its rules used to, right after
       pane.css, so chrome-clean.css still flattens it afterwards. -->
  <link rel="stylesheet" href="lib/tooltip.css" />
  <link rel="stylesheet" href="lib/toast.css" />
  <link rel="stylesheet" href="features/preview/preview.css" />
  <link rel="stylesheet" href="features/board/board.css" />
  <link rel="stylesheet" href="features/skills/skills.css" />
  <link rel="stylesheet" href="features/update/update.css" />
  <!-- the palette was never in app.css at all, so it has no chrome-clean half
       to sit after: its whole look is this one sheet, and it stays ahead of
       chrome-clean.css where its rules were written -->
  <link rel="stylesheet" href="features/palette/palette.css" />
  <link rel="stylesheet" href="styles/chrome-clean.css" />
  <!-- These took BOTH halves — app.css's and chrome-clean's — so they are
       self-contained and belong after it rather than before. The first three
       are the tail chrome-clean.css used to carry inline, in the order it
       carried them; that order is the reason the cascade did not move when
       they were cut out. -->
  <link rel="stylesheet" href="features/launcher/launcher.css" />
  <link rel="stylesheet" href="features/addagent/addagent.css" />
  <link rel="stylesheet" href="features/openrouter/openrouter.css" />
  <link rel="stylesheet" href="features/settings/settings.css" />
  <link rel="stylesheet" href="features/notifications/notifications.css" />
  <!-- the lead-agent launch card carries its own flat-popover treatment, so it
       belongs after chrome-clean.css rather than in the block above -->
  <link rel="stylesheet" href="features/orchestrator/orchestrator.css" />
  <!-- "Native Apple style" (Options → Appearance, macOS only). Every rule in
       it is scoped to :root[data-native="on"], so with the option off the
       sheet costs nothing; last in the order because its whole job is
       overriding the sheets above, tokens included. -->
  <link rel="stylesheet" href="styles/native-mac.css" />
  <!-- "Reduce transparency" (Options → Appearance). Scoped to
       :root[data-reduce-transparency="on"], so it costs nothing with the
       option off; after native-mac.css because it has to beat that sheet's
       blur too. -->
  <link rel="stylesheet" href="styles/reduce-transparency.css" />
</head>
<body>
  <header id="topbar">
    <div id="logo">
      <!-- the app icon's mark (build/icon.svg), minus its plate: a filled
           hexagon with the pulse knocked out of it. The viewBox is the
           hexagon's own bounding box so the mark fills the 28px box. -->
      <svg class="logo-icon" viewBox="18 13 64 74" aria-hidden="true">
        <polygon points="50,13 82,31.5 82,68.5 50,87 18,68.5 18,31.5" fill="var(--accent)"></polygon>
        <polyline points="26,50 34,50 40,50 45,35 52,66 58,42 63,56 67,50 74,50" fill="none" stroke="var(--on-accent)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"></polyline>
      </svg>
      <span class="logo-word">SWARM<span class="logo-eye">EYE</span></span>
    </div>
    <div class="spacer"></div>
    <!-- centre zone: which workspace the + Agent button will land in -->
    <div id="topbar-ctx" hidden>
      <span class="tb-ctx-name"></span>
    </div>
    <div class="spacer"></div>
    <span id="health-banner" class="topbar-chip chip-err" hidden>⚠ WSL unreachable</span>
    <button id="reattach-all" class="topbar-chip chip-amber" hidden data-tip="Reconnect all detached agents">⟳ Reattach all</button>
    <button id="update-pill" class="topbar-chip chip-accent" hidden></button>
    <!-- one segmented cluster: the secondary actions, one border -->
    <div id="topbar-actions">
      <button id="voice-btn" data-palette-keep aria-label="Speak to the app" data-tip="Hold to speak to the app — dictation fills the command palette (Ctrl+K) while you hold the button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6"/></svg>
      </button>
      <button id="preview-btn" aria-label="Preview" data-tip="Preview — open a local dev server beside the grid">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="13" rx="2"/><path d="M9 20.5h6M12 17.5v3"/></svg>
      </button>
      <button id="notif-btn" aria-label="Notifications" data-tip="Notifications — what your agents did"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5v2M8.6 4.5h6.8l1.2 8 2 3.5H5.4l2-3.5 1.2-8Z"/><path d="M9.8 19.2a2.2 2.2 0 0 0 4.4 0"/></svg><span id="notif-n" hidden></span></button>
      <!-- Native Apple style only (settings.js unhides it): Auto / Light / Dark.
           Auto is what the option does on its own — follow System Settings —
           and the other two override it. One icon shows at a time, picked by
           data-appearance in rail.css. -->
      <button id="appearance-btn" hidden data-appearance="system" aria-label="Appearance">
        <svg class="ap-ic ap-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16Z" fill="currentColor" stroke="none"/></svg>
        <svg class="ap-ic ap-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>
        <svg class="ap-ic ap-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.2A8.5 8.5 0 0 1 9.8 4a8.5 8.5 0 1 0 10.2 10.2Z"/></svg>
      </button>
      <button id="kbd-help" data-tip="Options" aria-label="Options">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
    <button id="add-agent" data-tip="Start a plain agent or a role preset in the selected workspace"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 7h8"/><path d="M7 3v8"/></svg>Agent</button>
  </header>

  <div id="body-wrap">
    <aside id="leftbar">
    <div id="leftbar-surface">
      <div class="u-title" id="usage-title"><span>Anthropic</span></div>
      <div id="usage" data-tip="Claude usage — click to refresh">
        <div class="u-row" id="u-5h">
          <div class="u-head"><span class="u-label">Session</span><span class="u-pct" id="usage-5h-pct"></span><span class="u-in" id="usage-5h-in"></span></div>
          <span class="u-track" id="usage-5h"><span class="u-fill"></span></span>
        </div>
        <div class="u-row" id="u-7d">
          <div class="u-head"><span class="u-label">Weekly</span><span class="u-pct" id="usage-7d-pct"></span><span class="u-in" id="usage-7d-in"></span></div>
          <span class="u-track" id="usage-7d"><span class="u-fill"></span></span>
        </div>
      </div>
      <!-- both hidden until an OpenRouter key is saved (topbar.js) -->
      <div class="u-title" id="or-usage-title" hidden><span>OpenRouter</span></div>
      <div id="usage-or" hidden>
        <!-- today is a plain figure: a share of the credits bought says nothing -->
        <div class="u-row" id="u-or-today">
          <div class="u-head"><span class="u-label">Today</span><span class="u-in" id="usage-or-today-in"></span></div>
        </div>
        <div class="u-row" id="u-or-credits">
          <div class="u-head"><span class="u-label">Credits</span><span class="u-pct" id="usage-or-credits-pct"></span><span class="u-in" id="usage-or-credits-in"></span></div>
          <span class="u-track" id="usage-or-credits"><span class="u-fill"></span></span>
        </div>
      </div>
      <div id="usage-gauges">
        <div class="gauge-box">
          <div class="gauge" id="gauge-5h">
            <svg width="78" height="78" viewBox="0 0 78 78">
              <circle class="gauge-track" cx="39" cy="39" r="32" fill="none" stroke-width="6"/>
              <circle class="gauge-fill" cx="39" cy="39" r="32" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="201"/>
            </svg>
            <div class="gauge-pct">—</div>
          </div>
          <div class="gauge-label">Session</div>
          <div class="gauge-sub" id="gauge-5h-sub"></div>
        </div>
        <div class="gauge-box">
          <div class="gauge gauge-amber" id="gauge-7d">
            <svg width="78" height="78" viewBox="0 0 78 78">
              <circle class="gauge-track" cx="39" cy="39" r="32" fill="none" stroke-width="6"/>
              <circle class="gauge-fill" cx="39" cy="39" r="32" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="201"/>
            </svg>
            <div class="gauge-pct">—</div>
          </div>
          <div class="gauge-label">Weekly</div>
          <div class="gauge-sub" id="gauge-7d-sub"></div>
        </div>
      </div>

      <div class="rail-div"></div>

      <div class="ws-head"><span>Workspaces</span></div>

      <nav id="workspaces"></nav>
      <button id="add-workspace" class="rail-tile rail-add" aria-label="Add a workspace folder">
        <span class="rail-tile-glyph">+</span><span class="rail-tile-name">Add workspace</span>
      </button>

      <div class="leftbar-spacer"></div>

      <div id="rail-foot">
      <button id="board-btn" class="rail-tile" aria-label="Task board (Ctrl+Shift+B)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9.5 4.5v15M14.8 4.5v15"/></svg>
        <span class="rail-tile-name">Task Board</span>
      </button>

      <button id="skills-btn" class="rail-tile" aria-label="Skills — install and manage agent skills">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5c0-1 .8-1.5 2-1.5h5v15H6c-1.2 0-2-.5-2-1.5V5.5Z"/><path d="M20 5.5c0-1-.8-1.5-2-1.5h-5v15h5c1.2 0 2-.5 2-1.5V5.5Z"/></svg>
        <span class="rail-tile-name">Skills</span>
      </button>
      </div>
    </div>
    </aside>

    <main id="grid-wrap">
      <div id="grid"></div>
      <div id="empty-state">
        <div class="big">No agents here<span class="plus">_</span></div>
        <div class="empty-hint">select a workspace, then hit + agent</div>
      </div>
    </main>

    <div data-fragment="board"></div>

    <div data-fragment="skills-view"></div>

    <div data-fragment="coord-modal"></div>

    <div data-fragment="notif-panel"></div>

    <div data-fragment="preview"></div>
  </div>

  <div id="toast"></div>

  <div data-fragment="palette-pop"></div>

  <div data-fragment="notif-pop"></div>

  <div data-fragment="board-category-pop"></div>

  <div data-fragment="session-view"></div>

  <div data-fragment="kbd-pop"></div>

  <div data-fragment="kbd-shortcuts-pop"></div>

  <!-- xterm and its addons are UMD builds: they define window.Terminal and
       friends, which pane.js reads. They stay classic <script>s and stay
       first, because a module cannot import a global that is not yet set. -->
  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="../node_modules/@xterm/addon-search/lib/addon-search.js"></script>
  <script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <!-- The renderer's one entry. There used to be twenty <script> tags here in
       a hand-sorted order that was load-bearing twice over; every one of those
       files is a module now and says what it needs at the top of itself.
       boot.js mounts the data-fragment placeholders above from each area's own
       .html, then imports app.js — see lib/fragments.js. -->
  <script type="module" src="boot.js"></script>
</body>
</html>
