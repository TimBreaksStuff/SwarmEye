<!-- renderer/features/coordinator/coordinator.html — the coordinator modal. -->

<template data-mount="coord-modal">
<!-- the coordinator: a multi-part request, then the subtasks it split into,
     reviewed before any of them becomes a task -->
<div id="coord-modal" hidden>
  <div id="coord-modal-box">
    <div id="coord-modal-head">
      <div id="coord-modal-title" class="kbd-title">Coordinator</div>
      <div class="board-head-actions">
        <button id="coord-close" class="pill" data-tip="Close (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/></svg><span>Close</span></button>
      </div>
    </div>
    <div id="coord-modal-meta"></div>
    <div id="coord-modal-body">
      <textarea id="coord-input" rows="6" placeholder="Describe everything you want done — the coordinator splits it into subtasks and assigns each one a role…" data-tip="Ctrl+Enter to split"></textarea>
      <div id="coord-plan" hidden></div>
    </div>
    <div id="coord-foot">
      <button id="coord-split" class="pill">Split</button>
      <button id="coord-create" class="pill" hidden>Create tasks</button>
    </div>
  </div>
</div>
</template>
